<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · D-Trade</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .login-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    padding: 32px 28px;
    width: 92%;
    max-width: 360px;
  }
  .login-brand {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 4px;
  }
  .login-sub {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .login-card .form-control {
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
  }
  .btn-login {
    background: #1a1a2e;
    color: #fff;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    width: 100%;
    border: none;
  }
  .btn-login:hover { background: #2a2a4e; color: #fff; }
  .login-err {
    color: #c62828;
    font-size: 13px;
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">📈 D-Trade</div>
    <div class="login-sub">请登录以访问你的账户</div>
    <form id="login-form" autocomplete="on">
      <div class="mb-3">
        <input type="text" class="form-control" id="username"
               placeholder="用户名" autocomplete="username" autofocus required>
      </div>
      <div class="mb-2">
        <input type="password" class="form-control" id="password"
               placeholder="密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="login-btn">登 录</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>

<script>
const form = document.getElementById('login-form');
const errEl = document.getElementById('login-err');
const btn = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/';
      return;
    }
    errEl.textContent = data.msg || '登录失败';
  } catch (err) {
    errEl.textContent = '网络错误，请重试';
  }
  btn.disabled = false;
  btn.textContent = '登 录';
});
</script>
</body>
</html>
