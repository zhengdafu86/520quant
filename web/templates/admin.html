<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 · D-Trade</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #f4f6f8; }
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .panel {
    background: #fff; border-radius: 12px; padding: 18px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 16px;
  }
  .panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  table { width: 100%; font-size: 14px; }
  th { color: #888; font-weight: 600; font-size: 12px; text-align: left; padding: 6px 8px; }
  td { padding: 8px; border-top: 1px solid #f0f0f0; vertical-align: middle; }
  .role-admin { background: #fff3e0; color: #e65100; }
  .role-user  { background: #e3f2fd; color: #1565c0; }
  .role-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .self-tag { font-size: 11px; color: #43a047; margin-left: 4px; }
  .msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
  .msg.ok  { color: #2e7d32; }
  .msg.err { color: #c62828; }
  .add-grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .add-grid input[type=text], .add-grid input[type=password] {
    flex: 1; min-width: 140px; border: 1px solid #ccc; border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 py-2 sticky-top">
  <span class="navbar-brand fw-bold">⚙️ 用户管理</span>
  <span class="d-flex align-items-center gap-2">
    <a href="/" class="btn btn-sm btn-outline-light py-0 px-2" style="font-size:12px">← 返回</a>
    <button class="btn btn-sm btn-outline-light py-0 px-2" style="font-size:12px" onclick="logout()">登出</button>
  </span>
</nav>

<div class="admin-wrap">

  <div class="panel">
    <h2>➕ 新增用户</h2>
    <div class="add-grid">
      <input type="text" id="new-username" placeholder="用户名（3-32位字母/数字/下划线）" autocomplete="off">
      <input type="password" id="new-password" placeholder="密码（≥6位）" autocomplete="new-password">
      <label class="d-flex align-items-center gap-1 small" style="white-space:nowrap">
        <input type="checkbox" id="new-admin"> 设为管理员
      </label>
      <button class="btn btn-dark btn-sm" id="add-btn" onclick="addUser()">添加</button>
    </div>
    <div class="msg" id="add-msg"></div>
  </div>

  <div class="panel">
    <h2>👥 用户列表</h2>
    <table>
      <thead>
        <tr><th>用户名</th><th>角色</th><th>创建时间</th><th style="text-align:right">操作</th></tr>
      </thead>
      <tbody id="user-tbody">
        <tr><td colspan="4" class="text-muted small">加载中...</td></tr>
      </tbody>
    </table>
    <div class="msg" id="list-msg"></div>
  </div>

</div>

<script>
// 全局 fetch：会话过期跳登录、登出
(function () {
  const _fetch = window.fetch;
  window.fetch = function (input, init) {
    init = init || {};
    if (!init.credentials) init.credentials = 'same-origin';
    return _fetch(input, init).then(function (res) {
      if (res.status === 401) window.location.href = '/login';
      return res;
    });
  };
  window.logout = function () {
    fetch('/api/logout', { method: 'POST' }).finally(() => window.location.href = '/login');
  };
})();

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function loadUsers() {
  const tbody = document.getElementById('user-tbody');
  try {
    const res = await fetch('/api/admin/users');
    if (res.status === 403) { window.location.href = '/'; return; }
    const data = await res.json();
    const users = data.users || [];
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-muted small">暂无用户</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => {
      const roleCls = u.is_admin ? 'role-admin' : 'role-user';
      const roleTxt = u.is_admin ? '管理员' : '普通用户';
      const selfTag = u.is_self ? '<span class="self-tag">（你）</span>' : '';
      const delBtn = u.is_self
        ? '<span class="text-muted small">—</span>'
        : `<button class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size:12px"
              onclick="delUser('${esc(u.username)}')">删除</button>`;
      return `<tr>
        <td><strong>${esc(u.username)}</strong>${selfTag}</td>
        <td><span class="role-badge ${roleCls}">${roleTxt}</span></td>
        <td class="text-muted small">${esc(u.created_at)}</td>
        <td style="text-align:right">${delBtn}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-danger small">加载失败</td></tr>';
  }
}

async function addUser() {
  const msg = document.getElementById('add-msg');
  const btn = document.getElementById('add-btn');
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const isAdmin  = document.getElementById('new-admin').checked;
  msg.className = 'msg';
  msg.textContent = '';
  if (!username || !password) { msg.className = 'msg err'; msg.textContent = '请填写用户名和密码'; return; }
  btn.disabled = true;
  try {
    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, is_admin: isAdmin }),
    });
    const data = await res.json();
    msg.className = 'msg ' + (data.ok ? 'ok' : 'err');
    msg.textContent = data.msg;
    if (data.ok) {
      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('new-admin').checked = false;
      loadUsers();
    }
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = '网络错误';
  }
  btn.disabled = false;
}

async function delUser(username) {
  if (!confirm(`确认删除用户「${username}」？\n其持仓/记录/自选/账户数据将一并永久清除，不可恢复！`)) return;
  const msg = document.getElementById('list-msg');
  msg.className = 'msg'; msg.textContent = '';
  try {
    const res = await fetch('/api/admin/users/' + encodeURIComponent(username), { method: 'DELETE' });
    const data = await res.json();
    msg.className = 'msg ' + (data.ok ? 'ok' : 'err');
    msg.textContent = data.msg;
    loadUsers();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = '网络错误';
  }
}

loadUsers();
</script>
</body>
</html>
