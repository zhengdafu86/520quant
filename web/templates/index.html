<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Trade 监控</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
<script>
// 全局 fetch 拦截：会话过期(401)自动跳登录页，并始终携带 session cookie
(function () {
  const _fetch = window.fetch;
  window.fetch = function (input, init) {
    init = init || {};
    if (!init.credentials) init.credentials = 'same-origin';
    return _fetch(input, init).then(function (res) {
      if (res.status === 401 &&
          !String((input && input.url) || input).includes('/api/login')) {
        window.location.href = '/login';
      }
      return res;
    });
  };
  window.logout = function () {
    fetch('/api/logout', { method: 'POST' }).finally(function () {
      window.location.href = '/login';
    });
  };
})();
</script>
</head>
<body>

<!-- 顶栏 -->
<nav class="navbar navbar-dark bg-dark px-3 py-2 sticky-top">
  <span class="navbar-brand fw-bold">📈 D-Trade</span>
  <span class="d-flex align-items-center gap-2">
    <span class="text-secondary small" id="refresh-time">--</span>
    <span class="text-light small" id="nav-user"></span>
    <a href="/admin" id="admin-link" class="btn btn-sm btn-outline-warning py-0 px-2"
       style="font-size:12px; display:none">⚙️ 用户管理</a>
    <button class="btn btn-sm btn-outline-light py-0 px-2" style="font-size:12px"
            onclick="logout()">登出</button>
  </span>
</nav>
<script>
// 顶栏显示当前登录用户名；管理员显示「用户管理」入口
fetch('/api/me').then(r => r.json()).then(d => {
  if (d && d.user) document.getElementById('nav-user').textContent = '👤 ' + d.user;
  if (d && d.is_admin) document.getElementById('admin-link').style.display = '';
}).catch(() => {});
</script>

<!-- 账户概览条 -->
<div class="account-bar px-3 py-2" id="account-bar">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <span class="label">总资产</span>
      <span class="value" id="total-assets">--</span>
    </div>
    <div>
      <span class="label">累计收益</span>
      <span class="value" id="total-return">--</span>
    </div>
    <div>
      <span class="label">现金</span>
      <span class="value" id="cash">--</span>
    </div>
  </div>
</div>

<!-- Tab 导航 -->
<ul class="nav nav-tabs nav-fill sticky-tab" id="mainTab">
  <li class="nav-item">
    <a class="nav-link active" data-tab="positions" href="#">📊 持仓</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" data-tab="watchlist" href="#">👁 自选</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" data-tab="scan" href="#">🔍 扫描</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" data-tab="trades" href="#">📋 记录</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" data-tab="account" href="#">💰 账户</a>
  </li>
</ul>

<!-- 内容区 -->
<div class="tab-content p-3">

  <!-- 持仓 Tab -->
  <div class="tab-pane active" id="tab-positions">
    <div id="positions-list"></div>
  </div>

  <!-- 自选 Tab -->
  <div class="tab-pane" id="tab-watchlist">
    <!-- 添加自选 -->
    <div class="add-bar mb-3">
      <div class="input-group">
        <input type="text" class="form-control" id="add-code"
               placeholder="输入股票代码（如 600487）" maxlength="6">
        <button class="btn btn-primary" onclick="addToWatchlist()">添加</button>
      </div>
    </div>

    <!-- 过滤 / 排序栏 -->
    <div class="filter-bar mb-2">
      <div class="filter-row">
        <span class="filter-label">信号</span>
        <button class="filter-chip active" data-wfilter="signal" data-value="金叉" onclick="toggleWatchFilter(this)">✅ 金叉</button>
        <button class="filter-chip active" data-wfilter="signal" data-value="回踩" onclick="toggleWatchFilter(this)">🔄 回踩</button>
        <button class="filter-chip active" data-wfilter="signal" data-value="粘合" onclick="toggleWatchFilter(this)">🔀 粘合</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">评分</span>
        <button class="filter-chip active" data-wfilter="sort" data-value="default"    onclick="setWatchSort(this)">默认</button>
        <button class="filter-chip"        data-wfilter="sort" data-value="score_desc" onclick="setWatchSort(this)">高→低</button>
        <button class="filter-chip"        data-wfilter="sort" data-value="score_asc"  onclick="setWatchSort(this)">低→高</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">买点</span>
        <button class="filter-chip active" data-wfilter="status" data-value="all"        onclick="setWatchStatus(this)">全部</button>
        <button class="filter-chip"        data-wfilter="status" data-value="has_signal" onclick="setWatchStatus(this)">有买点</button>
        <button class="filter-chip"        data-wfilter="status" data-value="no_signal"  onclick="setWatchStatus(this)">已消失</button>
      </div>
    </div>
    <div class="text-muted small mb-2" id="watch-count"></div>
    <div id="watchlist-list"></div>
  </div>

  <!-- 扫描 Tab -->
  <div class="tab-pane" id="tab-scan">
    <!-- 今日热点题材（同花顺热点聚合）-->
    <div id="hot-panel" class="hot-panel mb-2"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted small" id="scan-date">最新扫描：--</span>
      <button class="btn btn-sm btn-outline-primary" id="btn-scan" onclick="triggerScan()">手动扫描</button>
    </div>

    <!-- 过滤 / 排序栏 -->
    <div class="filter-bar mb-2">
      <div class="filter-row">
        <span class="filter-label">精选</span>
        <button class="filter-chip" data-filter="picks" onclick="toggleOnlyPicks(this)">🌟 只看精选 Top8</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">自选</span>
        <button class="filter-chip active" data-filter="watch" data-value="all"        onclick="setScanWatchFilter(this)">全部</button>
        <button class="filter-chip"        data-filter="watch" data-value="unselected" onclick="setScanWatchFilter(this)">未自选</button>
        <button class="filter-chip"        data-filter="watch" data-value="selected"   onclick="setScanWatchFilter(this)">已自选</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">信号</span>
        <button class="filter-chip active" data-filter="signal" data-value="金叉" onclick="toggleScanFilter(this)">✅ 金叉</button>
        <button class="filter-chip active" data-filter="signal" data-value="回踩" onclick="toggleScanFilter(this)">🔄 回踩</button>
        <button class="filter-chip active" data-filter="signal" data-value="粘合" onclick="toggleScanFilter(this)">🔀 粘合</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">板块</span>
        <button class="filter-chip active" data-filter="sector" data-value="all"  onclick="setSectorFilter(this)">全部</button>
        <button class="filter-chip"        data-filter="sector" data-value="up"   onclick="setSectorFilter(this)">⬆ 上升</button>
        <button class="filter-chip"        data-filter="sector" data-value="down" onclick="setSectorFilter(this)">⬇ 下降</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">排序</span>
        <button class="filter-chip active" data-filter="sort" data-value="default" onclick="setSortFilter(this)">默认(技术分)</button>
        <button class="filter-chip"        data-filter="sort" data-value="ai_desc" onclick="setSortFilter(this)">🤖AI高→低</button>
        <button class="filter-chip"        data-filter="sort" data-value="ai_asc"  onclick="setSortFilter(this)">🤖AI低→高</button>
        <button class="filter-chip"        data-filter="sort" data-value="rs_desc" onclick="setSortFilter(this)">RS高→低</button>
        <button class="filter-chip"        data-filter="sort" data-value="rs_asc"  onclick="setSortFilter(this)">RS低→高</button>
      </div>
    </div>
    <div class="text-muted small mb-2" id="scan-count"></div>
    <div id="scan-list"></div>
  </div>

  <!-- 交易记录 Tab -->
  <div class="tab-pane" id="tab-trades">
    <div id="trades-list"></div>
  </div>

  <!-- 账户 Tab -->
  <div class="tab-pane" id="tab-account">
    <div id="account-detail"></div>
  </div>

</div>

<!-- Toast 提示 -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body">操作成功</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
